name: IndexNow
# Daily: tell Bing (which feeds ChatGPT search) about every URL in the sitemap.
on:
  schedule:
    - cron: "20 17 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python3 scripts/indexnow.py
